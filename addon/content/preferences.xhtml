<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-enable"
    preference="enable"
    data-l10n-id="pref-enable"
  />
  <description
    style="margin: 4px 0 0; max-width: 45em; font-style: italic"
    data-l10n-id="pref-enable-help"
  ></description>
  <groupbox style="margin-top: 10px">
    <label value="Quick Language Buttons" style="font-weight: bold" />
    <html:textarea
      id="zotero-prefpane-__addonRef__-quickLanguages"
      preference="quickLanguages"
      rows="2"
      style="width: 100%; font-family: monospace; margin-top: 8px"
      placeholder="zh-CN, zh-TW, ja-JP, ko-KR, ..."
    ></html:textarea>
    <description
      style="margin-top: 5px"
      data-l10n-id="pref-quick-languages-help"
    >
      Enter language codes separated by commas (e.g., zh-CN, zh-TW, ja-JP)
    </description>
  </groupbox>
  <groupbox style="margin-top: 10px">
    <label value="Original Name Formatting" style="font-weight: bold" />
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-japanese-spacing"
      data-l10n-id="pref-japanese-spacing"
    />
    <description
      style="margin: 4px 0 0; max-width: 45em; font-style: italic"
      data-l10n-id="pref-japanese-spacing-help"
    ></description>
  </groupbox>
  <groupbox style="margin-top: 10px">
    <label value="Agent access" style="font-weight: bold" />
    <checkbox
      id="cne-agent-enable"
      label="Allow local agents to read and edit CNE metadata"
    />
    <description id="cne-agent-status" style="margin-top: 6px" />
    <hbox>
      <button
        id="cne-agent-copy"
        label="Copy connection"
        tooltiptext="Includes a secret token for your local agent"
      />
      <button
        id="cne-agent-revoke"
        label="Revoke token"
        tooltiptext="Disconnect existing clients and generate a new token"
      />
    </hbox>
  </groupbox>
</groupbox>
<spacer style="height: 24px" />
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
